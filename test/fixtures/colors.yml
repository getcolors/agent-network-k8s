# Example desired state for an agent-network-k8s deployment. Non-secret
# values only. Credentials belong in the gitignored .envrc.private as
# COLORS_PAR_* variables. Never export COLORS_PAR_PROFILE: it selects a
# deployment's remote state.
#
# Required credentials:
#   Vultr           COLORS_PAR_VULTR_API_KEY
#   Cloudflare      COLORS_PAR_CLOUDFLARE_API_TOKEN
#   state in R2     COLORS_PAR_R2_ACCESS_KEY_ID
#                   COLORS_PAR_R2_SECRET_ACCESS_KEY
#   Anthropic       COLORS_PAR_ANTHROPIC_API_KEY
#
# Everything else this deployment holds is generated in-cluster and supplied
# by nobody: the relay auth secret, the datastore encryption key, the session
# cookie key, the proxy access token, the local admin password, the durable
# automation token, and the agent's one-off setup key.

profile: agent-network-k8s-fixture
workdir: WORKDIR

provider-compute: vultr
provider-dns: cloudflare
provider-backend: local

# Preserve this guard in committed desired state. Destruction requires an
# explicitly authorized one-run override; never edit this flag to bypass it.
compute-prevent-destroy: true

# --- Agent Network -----------------------------------------------------------

agent-network-host: agent-network-k8s.example.com

agent-network-letsencrypt-email: admin@example.com
agent-network-admin-email: admin@example.com
agent-network-admin-name: Operator

# Models the Anthropic provider claims. Two models so both denial classes are
# demonstrable at zero upstream cost: the allowlist keeps only the first, so
# a request for the second is denied by the guardrail while an unclaimed
# model is denied by routing.
agent-network-provider-models:
  - id: claude-haiku-4-5-20251001
    input-per-1k: 0.001
    output-per-1k: 0.005
    cache-read-per-1k: 0.0001
    cache-creation-per-1k: 0.00125
  - id: claude-sonnet-4-5-20250929
    input-per-1k: 0.003
    output-per-1k: 0.015
    cache-read-per-1k: 0.0003
    cache-creation-per-1k: 0.00375

agent-network-allowed-models:
  - claude-haiku-4-5-20251001

# Cost ceilings, both desired state and both read back at acceptance.
agent-network-policy-budget-usd-per-day: 2
agent-network-policy-tokens-per-day: 2000000
agent-network-global-budget-usd-per-day: 5
agent-network-global-tokens-per-day: 5000000

agent-network-log-retention-days: 7
agent-network-log-level: info

# Container images, pinned by tag and digest: this package owns its manifests
# rather than running the upstream installer, so a silent retag upstream must
# surface as a digest mismatch rather than a behaviour change. Move the
# NetBird server, proxy, and client version together — one release train.
agent-network-server-image: netbirdio/netbird-server:0.77.1@sha256:e71f39cefcd90956d818dc4179084fd47d39f0741d1211b818ec640766b5794d
agent-network-dashboard-image: netbirdio/dashboard:v2.91.1@sha256:f3eb26c93ca9901a7385e88e12f6ad98d04e075e8817c664d73557fea123875f
agent-network-proxy-image: netbirdio/reverse-proxy:0.77.1@sha256:d3f5815133542c333e7e7166e19989adcce9afb15443a8de5ecbc87ef528c8f0
agent-network-traefik-image: traefik:v3.7.11@sha256:5203c3f39ca70de6790d964624e042463ffbd57715bc82be155cf224c0dd5144
agent-network-client-image: netbirdio/netbird:0.77.1@sha256:66f408b0c423e9c3376deea7bc0da78024d32494dd0f957344993015b74c4451

# The agent image is built in-cluster by kaniko from these pins and pushed to
# the deployment-owned registry.
agent-network-agent-base-image: node:22-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5
agent-network-claude-code-version: 2.1.246
agent-network-privoxy-version: 3.0.34-1
agent-network-gost-version: 3.2.6
agent-network-gost-sha256: b39037b0380ea001fb3c0c28441c2e10bfc694f90682739a65b53e55dce5238b
agent-network-kaniko-image: gcr.io/kaniko-project/executor:v1.24.0-debug@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd

# The DNS-01 client that issues the wildcard certificate at converge time.
agent-network-lego-version: 5.4.0

# --- Vultr -------------------------------------------------------------------

# No vultr-name: the Compute Name Standard names the cluster, node pool, load
# balancer and registry after the profile. Set it only for an account whose
# naming policy the profile cannot satisfy.
vultr-region: ams
vultr-vke-version: v1.35.2+1
vultr-node-plan: vc2-2c-4gb
vultr-node-count: 2
vultr-registry-plan: start_up

vultr-http-sources:
  - 0.0.0.0/0

# The pod CIDR VKE's Calico allocates from; converge re-validates it against
# the live pods.
vke-pod-cidr: 10.244.0.0/16

# --- R2 state backend ---------------------------------------------------------

r2-bucket: tofu-state-example
r2-endpoint: https://example.eu.r2.cloudflarestorage.com
