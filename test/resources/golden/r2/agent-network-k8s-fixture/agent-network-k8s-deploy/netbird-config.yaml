# Combined NetBird server configuration: management, signal, relay and STUN.
#
# The three __SECRET__ placeholders are substituted by converge.sh from the
# cluster's create-once Secrets and applied as a Kubernetes Secret — the
# rendered file in .colors/ never holds a real value. Regenerating any of
# them breaks a working deployment silently: a new store encryption key
# orphans the peer database, a new session cookie key logs everyone out, a
# new relay secret breaks relayed peers while every pod stays green.
server:
  listenAddress: ":80"
  exposedAddress: "https://agent-network-k8s.example.com:443"
  stunPorts:
    - 3478
  metricsPort: 9090
  healthcheckAddress: ":9000"
  logLevel: "info"
  logFile: "console"

  authSecret: "__RELAY_AUTH_SECRET__"
  dataDir: "/var/lib/netbird"

  auth:
    # The embedded IdP: the only identity provider this deployment has. The
    # local admin the bootstrap mints through /api/setup authenticates against
    # it; the agent authenticates with its peer identity, not with any IdP.
    issuer: "https://agent-network-k8s.example.com/oauth2"
    signKeyRefreshEnabled: true
    sessionCookieEncryptionKey: "__SESSION_COOKIE_ENCRYPTION_KEY__"
    dashboardRedirectURIs:
      - "https://agent-network-k8s.example.com/nb-auth"
      - "https://agent-network-k8s.example.com/nb-silent-auth"
    cliRedirectURIs:
      - "http://localhost:53000/"

  reverseProxy:
    # Traefik forwards over the pod network; the ingress NetworkPolicy is
    # what narrows the actual sources to Traefik's pods.
    trustedHTTPProxies:
      - "10.244.0.0/16"

  store:
    engine: "sqlite"
    encryptionKey: "__DATASTORE_ENCRYPTION_KEY__"
