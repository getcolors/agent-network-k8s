# Three namespaces, three Pod Security levels. The agent namespace carries
# the isolation claim and is `restricted`: every container in it runs
# non-root, seccomp-confined, all capabilities dropped. The gateway runs the
# upstream images, which assume more than restricted allows; the build
# namespace runs kaniko, which needs root but never privilege.
apiVersion: v1
kind: Namespace
metadata:
  name: agent-network-gateway
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: agent-network-agent
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: agent-network-build
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: baseline
